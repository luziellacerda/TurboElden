# TurboStations profile for the BSP-D3 family in standard Android HID mode.
# Pair the controller with X + HOME. A + HOME is ShootingPlus touch mapping
# mode and does not expose a normal Android gamepad to emulators.
input_driver = "android"
input_device = "BSP-D3"
input_device_display_name = "BSP-D3"
input_device_alt1 = "D3"
input_device_display_name_alt1 = "BSP-D3"
input_device_alt2 = "ShanWan D3"
input_device_display_name_alt2 = "BSP-D3"

# Android standard gamepad key codes. Face buttons follow physical position:
# bottom -> RetroPad B, right -> A, left -> Y, top -> X.
input_b_btn = "96"
input_a_btn = "97"
input_y_btn = "99"
input_x_btn = "100"
input_select_btn = "109"
input_start_btn = "108"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_btn = "102"
input_r_btn = "103"
input_l2_btn = "104"
input_r2_btn = "105"
input_l3_btn = "106"
input_r3_btn = "107"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_select_btn_label = "SELECT"
input_start_btn_label = "START"
input_l_btn_label = "LB"
input_r_btn_label = "RB"
input_l2_btn_label = "LT"
input_r2_btn_label = "RT"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
